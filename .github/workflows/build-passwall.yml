#
# Build luci-app-passwall IPKs for Aliyun AP8220
# Target : qualcommax/ipq807x (aarch64_cortex-a53)
#
# Passwall sources (ONLY):
#   - https://github.com/Openwrt-Passwall/openwrt-passwall
#   - https://github.com/Openwrt-Passwall/openwrt-passwall-packages
# Stock LEDE/coolsnowwolf copies of the same package names are purged.
#
name: Build luci-app-passwall

on:
  workflow_dispatch:
    inputs:
      passwall_ref:
        description: "openwrt-passwall branch/tag/commit (default: main)"
        required: false
        default: "main"
      packages_ref:
        description: "openwrt-passwall-packages branch/tag/commit (default: main)"
        required: false
        default: "main"
      no_cache:
        description: "Skip restore/save cache (true/false)"
        required: false
        default: "false"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-passwall.yml"

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Asia/Shanghai
  TARGET_BOARD: qualcommax
  TARGET_SUBTARGET: ipq807x
  TARGET_DEVICE: aliyun_ap8220
  PKG_ARCH: aarch64_cortex-a53
  # Cache paths (relative to workspace / LEDE root)
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: Build passwall IPK (AP8220)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo -E apt-mark hold grub-efi-amd64-signed || true
          sudo -E apt-get update
          sudo -E apt-get -y install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz \
            msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zip zlib1g-dev zstd
          sudo -E timedatectl set-timezone "$TZ"
          ccache -V || true
          df -h

      - name: Checkout LEDE source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve feed refs
        id: refs
        run: |
          echo "passwall_ref=${{ github.event.inputs.passwall_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          echo "packages_ref=${{ github.event.inputs.packages_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          echo "lede_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "lede_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Cache: download mirror (dl), host tools, cross toolchain, ccache.
      # Secondary builds with the same LEDE + passwall refs restore quickly.
      # ------------------------------------------------------------------
      - name: Restore build cache
        if: ${{ github.event.inputs.no_cache != 'true' }}
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            dl
            staging_dir/host
            staging_dir/toolchain-*
            build_dir/host
            .ccache
          key: passwall-${{ runner.os }}-${{ env.PKG_ARCH }}-lede-${{ steps.refs.outputs.lede_sha }}-pw-${{ steps.refs.outputs.passwall_ref }}-pkgs-${{ steps.refs.outputs.packages_ref }}
          restore-keys: |
            passwall-${{ runner.os }}-${{ env.PKG_ARCH }}-lede-${{ steps.refs.outputs.lede_sha }}-
            passwall-${{ runner.os }}-${{ env.PKG_ARCH }}-

      - name: Prepare ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -o cache_dir="$CCACHE_DIR"
          ccache -o max_size=2G
          ccache -o compression=true
          ccache -z || true
          echo "==== ccache before build ===="
          ccache -s || true

      - name: Add Openwrt-Passwall feeds only
        run: |
          PASSWALL_REF="${{ steps.refs.outputs.passwall_ref }}"
          PACKAGES_REF="${{ steps.refs.outputs.packages_ref }}"

          # OpenWrt feed syntax: url;branch  or  url^commit
          feed_line() {
            local name="$1" url="$2" ref="$3"
            if [[ "$ref" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "src-git ${name} ${url}^${ref}"
            else
              echo "src-git ${name} ${url};${ref}"
            fi
          }

          # Strip any previous passwall feed lines, then append official ones
          sed -i -E '/^src-git[[:space:]]+passwall(_packages)?[[:space:]]+/d' feeds.conf.default

          {
            feed_line passwall_packages \
              "https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" \
              "$PACKAGES_REF"
            feed_line passwall \
              "https://github.com/Openwrt-Passwall/openwrt-passwall.git" \
              "$PASSWALL_REF"
          } >> feeds.conf.default

          echo "==== feeds.conf.default ===="
          cat feeds.conf.default

      - name: Update feeds and purge LEDE passwall packages
        run: |
          set -euo pipefail

          # Official passwall package names (openwrt-passwall + openwrt-passwall-packages)
          # Anything with these names outside feeds/passwall{,_packages} is removed.
          PASSWALL_NAMES=(
            luci-app-passwall
            chinadns-ng
            dns2socks
            geoview
            hysteria
            ipt2socks
            microsocks
            naiveproxy
            shadow-tls
            shadowsocks-rust
            shadowsocksr-libev
            simple-obfs
            sing-box
            tcping
            v2ray-geodata
            v2ray-plugin
            xray-core
            xray-plugin
          )

          is_official_passwall_path() {
            case "$1" in
              feeds/passwall/*|feeds/passwall_packages/*|package/feeds/passwall/*|package/feeds/passwall_packages/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          purge_lede_passwall() {
            local root="$1"   # feeds or package/feeds
            echo "---- purge under ${root} ----"
            # Remove known names from every feed except passwall / passwall_packages
            if [ -d "$root" ]; then
              for feeddir in "$root"/*; do
                [ -d "$feeddir" ] || continue
                base="$(basename "$feeddir")"
                case "$base" in
                  passwall|passwall_packages) continue ;;
                esac
                for name in "${PASSWALL_NAMES[@]}"; do
                  # Common layouts: applications/luci-app-passwall, net/xray-core, or flat
                  rm -rf \
                    "${feeddir}/${name}" \
                    "${feeddir}/applications/${name}" \
                    "${feeddir}/net/${name}" \
                    "${feeddir}/utils/${name}" \
                    "${feeddir}/lang/${name}" \
                    "${feeddir}/libs/${name}"
                done
              done
            fi

            # Belt-and-suspenders: find by directory name anywhere under root
            if [ -d "$root" ]; then
              while IFS= read -r -d '' d; do
                rel="${d#./}"
                if is_official_passwall_path "$rel"; then
                  continue
                fi
                echo "REMOVE $rel"
                rm -rf "$d"
              done < <(
                find "$root" -type d \( \
                  -name 'luci-app-passwall' -o \
                  -name 'chinadns-ng' -o \
                  -name 'dns2socks' -o \
                  -name 'geoview' -o \
                  -name 'hysteria' -o \
                  -name 'ipt2socks' -o \
                  -name 'microsocks' -o \
                  -name 'naiveproxy' -o \
                  -name 'shadow-tls' -o \
                  -name 'shadowsocks-rust' -o \
                  -name 'shadowsocksr-libev' -o \
                  -name 'simple-obfs' -o \
                  -name 'sing-box' -o \
                  -name 'tcping' -o \
                  -name 'v2ray-geodata' -o \
                  -name 'v2ray-plugin' -o \
                  -name 'xray-core' -o \
                  -name 'xray-plugin' \
                \) -print0 2>/dev/null
              )
            fi
          }

          echo "==== feeds update ===="
          ./scripts/feeds update -a

          echo "==== purge LEDE/coolsnowwolf passwall packages from feed trees ===="
          purge_lede_passwall feeds

          # Rebuild indexes without the purged packages
          ./scripts/feeds update -i

          echo "==== install stock feeds (no passwall names left) ===="
          ./scripts/feeds install -a

          echo "==== force-install Openwrt-Passwall feeds ===="
          ./scripts/feeds install -a -f -p passwall_packages
          ./scripts/feeds install -a -f -p passwall
          ./scripts/feeds install -f luci-app-passwall

          echo "==== purge any residual package/feeds links outside passwall* ===="
          purge_lede_passwall package/feeds

          # Re-force so package/feeds/passwall* is complete after purge
          ./scripts/feeds install -a -f -p passwall_packages
          ./scripts/feeds install -a -f -p passwall

          echo "==== HARD VERIFY: only Openwrt-Passwall sources ===="
          if [ ! -d package/feeds/passwall/luci-app-passwall ]; then
            echo "ERROR: package/feeds/passwall/luci-app-passwall missing"
            find package feeds -type d -name 'luci-app-passwall' 2>/dev/null || true
            exit 1
          fi

          # No luci-app-passwall outside official feed
          while IFS= read -r d; do
            case "$d" in
              package/feeds/passwall/luci-app-passwall|feeds/passwall/luci-app-passwall) ;;
              *)
                echo "ERROR: extra luci-app-passwall at $d"
                exit 1
                ;;
            esac
          done < <(find package feeds -type d -name 'luci-app-passwall' 2>/dev/null)

          for name in xray-core sing-box chinadns-ng dns2socks ipt2socks microsocks \
                      tcping geoview shadowsocks-rust shadowsocksr-libev simple-obfs \
                      v2ray-plugin v2ray-geodata; do
            # Must exist under passwall_packages
            if [ ! -e "package/feeds/passwall_packages/${name}" ] && \
               [ ! -e "feeds/passwall_packages/${name}" ]; then
              echo "WARN: ${name} not found under passwall_packages (may be optional)"
            fi
            # Must NOT exist under other feeds
            while IFS= read -r d; do
              case "$d" in
                package/feeds/passwall_packages/*|feeds/passwall_packages/*|package/feeds/passwall/*|feeds/passwall/*) ;;
                *)
                  echo "ERROR: LEDE copy of ${name} still present: $d"
                  exit 1
                  ;;
              esac
            done < <(find package/feeds feeds -type d -name "${name}" 2>/dev/null)
          done

          echo "-- luci-app-passwall Makefile (must be Openwrt-Passwall) --"
          grep -E '^PKG_(NAME|VERSION|RELEASE)|^# Copyright' \
            package/feeds/passwall/luci-app-passwall/Makefile | head -20
          real="$(readlink -f package/feeds/passwall/luci-app-passwall || true)"
          echo "realpath: ${real}"
          case "${real}" in
            */feeds/passwall/*) echo "OK source tree is feeds/passwall" ;;
            *)
              echo "ERROR: luci-app-passwall does not resolve into feeds/passwall"
              exit 1
              ;;
          esac

          echo "-- key dep versions from passwall_packages --"
          for name in xray-core sing-box chinadns-ng; do
            mk="package/feeds/passwall_packages/${name}/Makefile"
            if [ -f "$mk" ]; then
              echo "[${name}]"
              grep -E '^PKG_(NAME|VERSION|RELEASE)' "$mk" | head -5
              echo "  -> $(readlink -f "package/feeds/passwall_packages/${name}")"
            fi
          done

          echo "-- package/feeds tree (passwall*) --"
          ls -la package/feeds/passwall package/feeds/passwall_packages 2>/dev/null | head -100

      - name: Generate .config (AP8220 + passwall)
        run: |
          cat > .config << 'EOF'
          # ---- Target: Aliyun AP8220 (IPQ8071 / aarch64_cortex-a53) ----
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_aliyun_ap8220=y

          # ccache for faster rebuilds
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y

          # Language
          CONFIG_LUCI_LANG_zh_Hans=y

          # ---- luci-app-passwall (Openwrt-Passwall) + aarch64 defaults ----
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          # Prefer nftables transparent proxy (firewall4)
          # CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy is not set
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy is not set
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server is not set
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadow_TLS is not set
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin is not set

          # Explicit packages from openwrt-passwall-packages
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_ipt2socks=y
          CONFIG_PACKAGE_microsocks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_shadowsocks-rust-sslocal=y
          CONFIG_PACKAGE_shadowsocksr-libev-ssr-local=y
          CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir=y
          CONFIG_PACKAGE_simple-obfs-client=y
          CONFIG_PACKAGE_v2ray-plugin=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CONFIG_PACKAGE_haproxy=y
          EOF

          sed -i 's/^[[:space:]]*//' .config
          make defconfig

          # Point OpenWrt ccache at our cached directory
          if grep -q '^CONFIG_CCACHE=y' .config; then
            echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          fi

          echo "==== selected target / passwall options ===="
          grep -E 'CONFIG_TARGET_qualcommax|DEVICE_aliyun|CONFIG_CCACHE|CONFIG_PACKAGE_luci-app-passwall|CONFIG_PACKAGE_xray|CONFIG_PACKAGE_sing-box|CONFIG_PACKAGE_chinadns' .config || true

      - name: Download package sources
        run: |
          make download -j8
          find dl -type f -size -1024c -print -delete || true
          echo "==== dl size ===="
          du -sh dl 2>/dev/null || true

      - name: Compile luci-app-passwall and Openwrt-Passwall deps only
        run: |
          set -euo pipefail

          NPROC="$(nproc)"
          compile_target() {
            local target="$1"
            echo "==== compile: ${target} ( -j${NPROC} ) ===="
            if ! make -j"${NPROC}" "${target}"; then
              echo "==== retry ${target} with -j1 V=s ===="
              make -j1 V=s "${target}"
            fi
          }

          # package/*/compile expects a finished cross toolchain (libc, gcc, ...).
          # Without tools/toolchain first, package/libs/toolchain fails with:
          #   cp: cannot stat 'staging_dir/toolchain-.../lib/ld-musl-*.so*'
          echo "==== 1/3 host tools ===="
          compile_target tools/install

          echo "==== 2/3 cross toolchain (aarch64_cortex-a53) ===="
          compile_target toolchain/install

          echo "==== verify toolchain libc present ===="
          TC_DIR="$(ls -d staging_dir/toolchain-aarch64_*_musl 2>/dev/null | head -1 || true)"
          if [ -z "${TC_DIR}" ]; then
            echo "ERROR: staging_dir/toolchain-aarch64_*_musl missing after toolchain/install"
            ls -la staging_dir || true
            exit 1
          fi
          if ! ls "${TC_DIR}"/lib/ld-musl-*.so* >/dev/null 2>&1; then
            echo "ERROR: ld-musl not found under ${TC_DIR}/lib"
            ls -la "${TC_DIR}/lib" || true
            exit 1
          fi
          echo "OK toolchain: ${TC_DIR}"
          ls "${TC_DIR}"/lib/ld-musl-*.so* || true

          # Main app — must be the Openwrt-Passwall feed copy
          if [ ! -d package/feeds/passwall/luci-app-passwall ]; then
            echo "ERROR: package/feeds/passwall/luci-app-passwall missing"
            exit 1
          fi

          echo "==== 3/3 luci-app-passwall + passwall_packages ===="
          compile_target package/feeds/passwall/luci-app-passwall/compile

          # Companion packages from openwrt-passwall-packages (not LEDE packages feed)
          for pkg in \
            chinadns-ng dns2socks ipt2socks microsocks tcping geoview \
            xray-core sing-box shadowsocks-rust shadowsocksr-libev \
            simple-obfs v2ray-plugin v2ray-geodata
          do
            if [ -d "package/feeds/passwall_packages/${pkg}" ]; then
              compile_target "package/feeds/passwall_packages/${pkg}/compile" \
                || echo "WARN: ${pkg} compile failed (optional / may already exist)"
            else
              echo "SKIP: package/feeds/passwall_packages/${pkg} not present"
            fi
          done

          echo "==== ccache after build ===="
          ccache -s || true
          df -h
          echo "==== produced IPKs (sample) ===="
          find bin/packages bin/targets -type f -name '*.ipk' 2>/dev/null | head -120 || true

      - name: Collect IPK artifacts
        id: collect
        run: |
          OUT="passwall-ipk-${PKG_ARCH}-ap8220"
          mkdir -p "$OUT"/{passwall,passwall_packages,kmods,other,all}

          # ONLY collect from Openwrt-Passwall feed output dirs first
          if [ -d "bin/packages/${PKG_ARCH}/passwall" ]; then
            cp -a bin/packages/${PKG_ARCH}/passwall/*.ipk "$OUT/passwall/" 2>/dev/null || true
          fi
          if [ -d "bin/packages/${PKG_ARCH}/passwall_packages" ]; then
            cp -a bin/packages/${PKG_ARCH}/passwall_packages/*.ipk "$OUT/passwall_packages/" 2>/dev/null || true
          fi

          # nft/ipt kmods (kernel-matched; optional)
          KMOD_DIR="bin/targets/${TARGET_BOARD}/${TARGET_SUBTARGET}/packages"
          if [ -d "$KMOD_DIR" ]; then
            shopt -s nullglob
            for f in \
              "$KMOD_DIR"/kmod-nft-*.ipk \
              "$KMOD_DIR"/kmod-nf-reject*.ipk \
              "$KMOD_DIR"/kmod-ipt-*.ipk
            do
              cp -a "$f" "$OUT/kmods/"
            done
            shopt -u nullglob
          fi

          # Generic system helpers that are NOT passwall-specific (curl, etc.)
          # These legitimately come from LEDE base/packages feeds.
          for feed in base packages luci routing; do
            dir="bin/packages/${PKG_ARCH}/${feed}"
            [ -d "$dir" ] || continue
            shopt -s nullglob
            for name in \
              haproxy curl coreutils coreutils-base64 coreutils-nohup \
              coreutils-timeout ip-full resolveip lyaml luci-compat \
              luci-lib-jsonc unzip dnsmasq-full
            do
              for f in "$dir"/${name}_*.ipk; do
                [ -f "$f" ] && cp -a "$f" "$OUT/other/"
              done
            done
            shopt -u nullglob
          done

          # Refuse to ship LEDE copies of passwall-named IPKs from packages/luci feeds
          shopt -s nullglob
          for feed in packages luci; do
            dir="bin/packages/${PKG_ARCH}/${feed}"
            [ -d "$dir" ] || continue
            for name in luci-app-passwall xray-core sing-box chinadns-ng; do
              for f in "$dir"/${name}*.ipk; do
                echo "NOTE: ignoring non-passwall-feed IPK $f (should not be used)"
              done
            done
          done
          shopt -u nullglob

          find "$OUT/passwall" "$OUT/passwall_packages" "$OUT/kmods" "$OUT/other" \
            -type f -name '*.ipk' -exec cp -a {} "$OUT/all/" \;

          {
            echo "# luci-app-passwall IPK build"
            echo
            echo "- Target board: \`${TARGET_BOARD}/${TARGET_SUBTARGET}\`"
            echo "- Device: \`${TARGET_DEVICE}\` (Aliyun AP8220)"
            echo "- Package arch: \`${PKG_ARCH}\`"
            echo "- LEDE commit: \`${{ steps.refs.outputs.lede_short }}\`"
            echo "- passwall ref: \`${{ steps.refs.outputs.passwall_ref }}\`"
            echo "- passwall-packages ref: \`${{ steps.refs.outputs.packages_ref }}\`"
            echo "- Build time (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Cache restored: \`${{ steps.cache.outputs.cache-hit || 'n/a' }}\`"
            echo
            echo "## Source policy"
            echo "- \`luci-app-passwall\` and proxy deps: **Openwrt-Passwall only**"
            echo "- LEDE/coolsnowwolf duplicates of the same names are purged before build"
            echo
            echo "## Packages (\`all/\`)"
            echo '```'
            ls -lh "$OUT/all" | sed '1d' || true
            echo '```'
            echo
            echo "## Install on device"
            echo '```sh'
            echo "cd /tmp/passwall"
            echo "opkg update"
            echo "opkg install ./*.ipk"
            echo '```'
          } | tee "$OUT/README.md"

          COUNT=$(find "$OUT/all" -type f -name '*.ipk' | wc -l | tr -d ' ')
          echo "ipk_count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "out_dir=${OUT}" >> "$GITHUB_OUTPUT"
          echo "Found ${COUNT} ipk file(s)"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no IPK produced"
            find bin -name '*.ipk' 2>/dev/null | head -200 || true
            exit 1
          fi

          if ! ls "$OUT/all"/luci-app-passwall_*.ipk >/dev/null 2>&1; then
            echo "ERROR: luci-app-passwall_*.ipk not found"
            find bin -name '*passwall*.ipk' 2>/dev/null || true
            exit 1
          fi

          # Sanity: primary IPK should live under the passwall feed output
          if ! ls "$OUT/passwall"/luci-app-passwall_*.ipk >/dev/null 2>&1; then
            echo "WARN: luci-app-passwall not under passwall/ feed output (check packaging feed name)"
            ls -la "$OUT/passwall" "$OUT/all" || true
          fi

          tar -czf "${OUT}.tar.gz" "$OUT"
          zip -r "${OUT}.zip" "$OUT"
          ls -lh "${OUT}.tar.gz" "${OUT}.zip"

      # Only save when there was no exact key hit (save fails if key already exists)
      - name: Save build cache
        if: ${{ always() && github.event.inputs.no_cache != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            dl
            staging_dir/host
            staging_dir/toolchain-*
            build_dir/host
            .ccache
          key: passwall-${{ runner.os }}-${{ env.PKG_ARCH }}-lede-${{ steps.refs.outputs.lede_sha }}-pw-${{ steps.refs.outputs.passwall_ref }}-pkgs-${{ steps.refs.outputs.packages_ref }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.out_dir }}
          path: |
            ${{ steps.collect.outputs.out_dir }}.tar.gz
            ${{ steps.collect.outputs.out_dir }}.zip
            ${{ steps.collect.outputs.out_dir }}/README.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: passwall-${{ github.run_number }}-${{ env.PKG_ARCH }}
